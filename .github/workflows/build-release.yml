name: Build & Release with Attestation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # 上传 Release assets
  id-token: write        # 生成 OIDC token（attest 必须）
  attestations: write    # 写入构建证明

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build renderer (Vite)
        run: npx vite build

      - name: Build Electron main (TypeScript)
        run: npx tsc -p tsconfig.electron.json

      - name: Package Electron app
        run: npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 找到两个目标文件（安装包 + 便携版）───────────────────────────────────
      - name: Locate release files
        id: files
        shell: pwsh
        run: |
          # NSIS installer: "Google Sheet Manager Setup X.X.X.exe"
          $setup = Get-ChildItem release/ -Recurse -Filter "*Setup*.exe" | Select-Object -First 1
          # Portable: "Google Sheet Manager-X.X.X-portable.exe"
          $portable = Get-ChildItem release/ -Recurse -Filter "*portable*.exe" | Select-Object -First 1

          if (-not $setup)    { Write-Error "Setup installer not found!"; exit 1 }
          if (-not $portable) { Write-Error "Portable exe not found!"; exit 1 }

          Write-Host "Setup:    $($setup.FullName)  ($([math]::Round($setup.Length/1MB,1)) MB)"
          Write-Host "Portable: $($portable.FullName)  ($([math]::Round($portable.Length/1MB,1)) MB)"

          "setup=$($setup.FullName)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "portable=$($portable.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ── SLSA 构建证明（必须在 Release 上传前，同一 job 同一文件）─────────────
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.files.outputs.setup }}
            ${{ steps.files.outputs.portable }}

      # ── 上传到 GitHub Release（只上传两个用户文件）────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Google Sheet Manager ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            ${{ steps.files.outputs.setup }}
            ${{ steps.files.outputs.portable }}
          body: |
            ## Google Sheet Manager ${{ github.ref_name }}

            ### 下载说明

            | 文件 | 说明 |
            |------|------|
            | 📦 `Google Sheet Manager Setup *.exe` | **安装包（推荐）** — 双击安装，创建桌面快捷方式，可从控制面板卸载 |
            | 🔌 `Google Sheet Manager-*-portable.exe` | **便携版** — 无需安装，双击直接运行，可放 U 盘 |

            ---

            ### 首次使用
            1. 进入「设置」，填入 Google OAuth 客户端 ID 和密钥
            2. 点击「登录 Google 账号」完成授权
            3. 在「表格库」添加文件，在「权限库」管理邮箱，在「执行操作」批量同步

            **系统要求**：Windows 10 / 11（64位）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
